name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The desktop app's Rust store (ADR-0013): built so the shared
      # StorageProvider contract suite runs against it, and required so a
      # missing binary fails instead of skipping.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/store
      - run: cargo fmt --check && cargo build --release --locked
        working-directory: packages/app/store
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          OUTTRAY_REQUIRE_RUST_STORE: '1'
      - run: pnpm build

  # The desktop shell (ADR-0013). Built on Linux and on macOS, because the
  # Keychain and Application Support code only compiles on macOS. Unsigned
  # until #12; nothing here is published.
  shell:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      # The shell embeds the built web UI at compile time.
      - run: pnpm build && pnpm --filter @outtray/app bundle
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri
      - run: cargo fmt --check && cargo build --locked && cargo test --locked
        working-directory: packages/app/src-tauri

  # The minimum Rust both crates declare (`rust-version`, #131). CI's other
  # jobs use latest stable, so without this a lockfile bump could raise the
  # real minimum and only a contributor on an older toolchain would notice.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm --filter @outtray/app bundle
      # Both manifests must declare the same minimum; install exactly that.
      - run: |
          shell=$(grep -m1 '^rust-version' packages/app/src-tauri/Cargo.toml | cut -d'"' -f2)
          store=$(grep -m1 '^rust-version' packages/app/store/Cargo.toml | cut -d'"' -f2)
          test -n "$shell" && test "$shell" = "$store"
          rustup toolchain install "$shell" --profile minimal
          rustup default "$shell"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/app/store
            packages/app/src-tauri
      - run: cargo check --locked
        working-directory: packages/app/store
      - run: cargo check --locked
        working-directory: packages/app/src-tauri
