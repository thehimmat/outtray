name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The desktop app's Rust store (ADR-0013): built so the shared
      # StorageProvider contract suite runs against it, and required so a
      # missing binary fails instead of skipping.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/store
      - run: cargo fmt --check && cargo build --release --locked
        working-directory: packages/app/store
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          OUTTRAY_REQUIRE_RUST_STORE: '1'
      - run: pnpm build

  # The desktop shell (ADR-0013). Built on Linux and on macOS, because the
  # Keychain and Application Support code only compiles on macOS. Unsigned
  # until #12; nothing here is published.
  shell:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      # The shell embeds the built web UI at compile time.
      - run: pnpm build && pnpm --filter @outtray/app bundle
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/app/src-tauri
      - run: cargo fmt --check && cargo build --locked && cargo test --locked
        working-directory: packages/app/src-tauri

  # The Apple Vision OCR sidecar (#8, #160), built, unit-tested and run live
  # where Vision exists. On a PR from this repository it records every page
  # and commits any recording whose reading changed back to the PR branch, so
  # recordings never have to be copied out of a log; a commit pushed with the
  # workflow token does not start another run. It fails, and writes nothing,
  # if a field the committed snapshot read is now missed. Elsewhere (main, fork
  # PRs) it only checks.
  ocr:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      SAME_REPO_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The branch itself on a same-repo PR, so the job can push to it.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: swift build -c release --package-path packages/ocr-vision
      - run: swift test --package-path packages/ocr-vision
      - run: test "$(packages/ocr-vision/.build/release/outtray-ocr --contract)" = ocr-v1
      - run: sw_vers && /usr/bin/time -l packages/ocr-vision/.build/release/outtray-ocr packages/evals/fixtures/synthetic/bill-001.png > /dev/null
      - if: env.SAME_REPO_PR != 'true'
        run: pnpm eval:ocr check
      - if: env.SAME_REPO_PR == 'true'
        name: Record, and commit changed recordings to the PR branch
        run: |
          pnpm eval:ocr record
          if [ -z "$(git status --porcelain -- packages/evals/recordings/ocr packages/evals/fixtures/ocr.json)" ]; then
            echo "Recordings unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/evals/recordings/ocr packages/evals/fixtures/ocr.json docs/evals/ocr-scoreboard.md
          git commit -m "chore(evals): record OCR on the CI Mac"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  # The minimum Rust both crates declare (`rust-version`, #131). CI's other
  # jobs use latest stable, so without this a lockfile bump could raise the
  # real minimum and only a contributor on an older toolchain would notice.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm --filter @outtray/app bundle
      # Both manifests must declare the same minimum; install exactly that.
      - run: |
          shell=$(grep -m1 '^rust-version' packages/app/src-tauri/Cargo.toml | cut -d'"' -f2)
          store=$(grep -m1 '^rust-version' packages/app/store/Cargo.toml | cut -d'"' -f2)
          test -n "$shell" && test "$shell" = "$store"
          rustup toolchain install "$shell" --profile minimal
          rustup default "$shell"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/app/store
            packages/app/src-tauri
      - run: cargo check --locked
        working-directory: packages/app/store
      - run: cargo check --locked
        working-directory: packages/app/src-tauri
