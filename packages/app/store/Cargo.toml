[package]
name = "outtray-store"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
publish = false
description = "The encrypted store for the desktop app (ADR-0011, ADR-0013): the Rust side of StorageProvider, driven by JSON commands."

[dependencies]
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
serde_json = "1"

[profile.release]
debug = false
